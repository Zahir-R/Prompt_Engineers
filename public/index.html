label{display:block;font-weight:800;font-size:.85rem;margin:.8rem 0 .25rem}input,select,textarea{width:100%;font:600 1rem Nunito;padding:.6rem .8rem;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink)}

<header>
<button class="brand" onclick="go('inicio')" aria-label="Ir al inicio"><svg id="logo" viewBox="0 0 100 100"></svg><div><b>Mates</b><span>cuaderno de aventuras</span></div></button>

<script>
const OWL='<path d="M18 40 L20 10 L40 24 Q50 20 60 24 L80 10 L82 40 Q90 60 76 80 Q50 98 24 80 Q10 60 18 40Z" fill="#eea133" stroke="#2a2530" stroke-width="3.5" stroke-linejoin="round"/><circle cx="36" cy="48" r="13" fill="#fff" stroke="#2a2530" stroke-width="3"/><circle cx="64" cy="48" r="13" fill="#fff" stroke="#2a2530" stroke-width="3"/><circle cx="38" cy="50" r="5" fill="#2a2530"/><circle cx="62" cy="50" r="5" fill="#2a2530"/><path d="M45 58 L55 58 L50 67Z" fill="#c0392b" stroke="#2a2530" stroke-width="2.5" stroke-linejoin="round"/><path d="M40 74 Q50 82 60 74" fill="none" stroke="#2a2530" stroke-width="3" stroke-linecap="round"/><path d="M84 52 L96 30" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>';
logo.innerHTML=OWL;
const IC={inicio:'<path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-7h6v7"/>',ruta:'<circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h8a3 3 0 010 6H8a3 3 0 000 6h8"/>',docente:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 3 9 3 12 0v-5"/>',diag:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>'};

const $=s=>document.querySelector(s);
/* ---------- datos ---------- */
let EX=[{id:1,cat:'Adición',k:'',lv:'Tercero primaria',t:'Ayuda a juntar las manzanas',q:'Lucas tiene 17 manzanas y María le regala 15 más. ¿Cuántas manzanas tiene Lucas en total?',a:17,b:15,op:'+'},
{id:2,cat:'Sustracción',k:'s',lv:'Tercero primaria',t:'Ayuda a repartir los caramelos',q:'Ana tiene 42 caramelos y regala 17 a sus amigos. ¿Cuántos caramelos le quedan?',a:42,b:17,op:'-'}];

/* ---------- motor de desglose (4.2) ---------- */
function blk(n,c){const t=Math.floor(n/10),u=n%10;return '<span class="bk c-'+c+'">'+'<i class="t"></i>'.repeat(t)+'<i class="u"></i>'.repeat(u)+'</span>'}
function steps(e){const{a,b}=e,R=ans(e),ua=a%10,ub=b%10,ta=a/10|0,tb=b/10|0;let s;
if(e.op=='+'){const U=ua+ub,ca=U>9?1:0;s=[
['Identificar los datos','blue','Tenemos '+a+' y '+b+'. Hay que sumar los dos números.','',[[a,'blue'],[b,'blue']]],
['Sumar las unidades','orange','Sumamos las unidades: '+ua+' + '+ub+' = '+U+'. '+(ca?'Como es mayor que 9, formamos 1 decena y quedan '+U%10+' unidades sueltas.':'No pasa de 9, no llevamos nada.'),ua+' + '+ub+' = '+U,[[U,'orange']]],
['Sumar las decenas','green','Sumamos las decenas: '+ta+' + '+tb+(ca?' + 1 que llevamos':'')+' = '+(ta+tb+ca)+' decenas.',ta+' + '+tb+(ca?' + 1':'')+' = '+(ta+tb+ca),[[(ta+tb+ca)*10,'green']]],
['Resultado final','purple','Juntamos '+(R/10|0)+' decenas y '+R%10+' unidades. El resultado es '+R+'.','= '+R,[[R,'purple']]],
['Comprobar','amber','Comprobamos al revés: '+R+' − '+b+' = '+a+'. ¡Coincide con el dato inicial!',R+' − '+b+' = '+a,[[a,'amber']]]]}
else{const br=ua<ub,U=ua+(br?10:0)-ub,T=ta-(br?1:0)-tb;s=[
['Identificar los datos','blue','Empezamos con '+a+' y le quitamos '+b+'.','',[[a,'blue'],[b,'blue']]],
['Restar las unidades','orange',br?'A '+ua+' unidades no podemos quitarle '+ub+'. Pedimos prestada 1 decena: '+ua+' + 10 = '+(ua+10)+'. Ahora '+(ua+10)+' − '+ub+' = '+U+'.':'Restamos las unidades: '+ua+' − '+ub+' = '+U+'.',(br?ua+10:ua)+' − '+ub+' = '+U,[[U,'orange']]],
['Restar las decenas','green','Restamos las decenas: '+ta+(br?' − 1 que prestamos':'')+' − '+tb+' = '+T+' decenas.',ta+(br?' − 1':'')+' − '+tb+' = '+T,[[T*10,'green']]],
['Resultado final','purple','Juntamos '+T+' decenas y '+U+' unidades. Quedan '+R+'.','= '+R,[[R,'purple']]],
['Comprobar','amber','Comprobamos al revés: '+R+' + '+b+' = '+a+'. ¡Coincide con el dato inicial!',R+' + '+b+' = '+a,[[a,'amber']]]]}
return s.map(x=>({t:x[0],c:x[1],x:x[2],o:x[3],v:x[4]}))}
/* ---------- router ---------- */
function go(h){location.hash=h}
function nav(v){$('#nav').innerHTML=[['inicio','Inicio'],['ruta','Ruta'],['docente','Docente']].map(([k,l])=>'<button class="'+(v==k||(v=='reto'&&k=='ruta')?'on':'')+'" onclick="go(\''+k+'\')">'+svg(k)+l+'</button>').join('')+'<button class="dx" onclick="diag()">'+svg('diag')+'<span>Diagnóstico</span></button><button class="th" onclick="theme()" aria-label="Cambiar entre modo claro y oscuro">'+(document.documentElement.dataset.theme=='dark'?'☀️':'🌙')+'</button>'}
function route(){const[h,id]=(location.hash.slice(1)||'inicio').split('-'),v=['inicio','ruta','docente','reto'].includes(h)?h:'inicio';nav(v);closeM();
$('#app').innerHTML='<div class="view">'+({inicio:home,ruta:ruta,docente:docente,reto:()=>reto(+id)})[v]()+'</div>';scrollTo({top:0});if(v=='docente')prev()}
addEventListener('hashchange',route);
/* ---------- vistas ---------- */

function home(){return '<section class="hero"><div><span class="pill">✦ ABSTRACTHON 2026 · EDUCACIÓN</span><h1>Las mates se aprenden <u>paso a paso</u></h1><p>Un cuaderno de aventuras para primaria. Resuelve retos cortos y abre el <b>Modo Desglose</b> cuando quieras ver el procedimiento en colores, bloques y palabras simples.</p><div class="row"><button class="btn red" onclick="go(\'ruta\')">Empezar la ruta →</button><button class="btn" onclick="go(\'docente\')">Soy docente</button></div></div>'+
'<div class="card owlcard"><svg viewBox="0 0 100 100">'+OWL+'</svg><q>¡Hola! Soy Tinta. Si algo no sale, lo miramos por partes.</q><div class="fact"><b>UN DATO PARA CONVERSAR</b>En 6.° de primaria, solo <i>9%</i> alcanza el nivel mínimo en matemática en Bolivia.<br><small>Fuente: ERCE 2023, UNESCO.</small></div></div></section>'+
'<div class="sec"><h2>📖 Fichas para hoy</h2><span class="hand" style="font-size:1.2rem">elige una hoja y empieza a resolver</span><a onclick="go(\'ruta\')">Ver ruta completa →</a></div><div class="grid">'+EX.slice(0,4).map(ficha).join('')+'</div>'+

save=function(){if($('#err').textContent)return;tmp.id=nid();tmp.own=S.id;tmp.pub=true;DB.x.push({...tmp});persist();EX=vis();toast('Reto guardado y publicado en tu clase');tab('r')};
const alumnos=()=>{const c=cls(S),tot=BASE.length+DB.x.filter(e=>e.own==S.id&&e.pub!==false).length;return `<div class="card panel" style="margin-top:1.4rem"><h2>Mis alumnos (${c.length})</h2>${c.length?c.map(s=>{const n=Object.keys(s.done).length,a=ago(s);return `<div class="chip" style="flex-wrap:wrap"><span style="font-size:1.6rem">${s.av}</span><b style="flex:1;min-width:90px">${esc(s.name)}</b><span>🔥 ${streak(s)}</span><div style="width:120px">${bar(n/tot*100)}</div>${a>=3?`<span class="pill" style="background:var(--yel)">💤 ${a>=99?'aún no practica':a+' días sin practicar'}</span>`:''}</div>`}).join(''):`<p style="color:var(--mut)">Aún no hay estudiantes. Comparte tu código <b>${S.code}</b> para que se unan al crear su cuenta.</p>`}</div>`};
const mperfil=()=>{const c=cls(S),o=DB.x.filter(e=>e.own==S.id&&e.pub!==false),ok=c.reduce((a,s)=>a+Object.values(s.h).reduce((x,y)=>x+y,0),0),ko=c.reduce((a,s)=>a+Object.values(s.f).reduce((x,y)=>x+y,0),0),fl={};c.forEach(s=>Object.keys(s.f).forEach(k=>fl[k]=(fl[k]||0)+s.f[k]));const rk=Object.entries(fl).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]);
return `<div class="two" style="margin-top:1.4rem"><div class="card panel"><h2>Mi perfil público</h2><label>Biografía (máx. 200)</label><textarea id="pb" rows="3" maxlength="200">${esc(S.bio)}</textarea><label>Institución</label><input id="ps" value="${esc(S.school)}"><label>Grados que enseño</label><input id="pg" value="${esc(S.grades)}"><label>Especialidad</label><input id="pe" value="${esc(S.spec)}"><label>Avatar</label><div class="avs">${AV.map(a=>`<button type="button" class="${a==S.av?'on':''}" onclick="S.av='${a}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==this))">${a}</button>`).join('')}</div><div class="row" style="margin-top:1rem"><button class="btn grn" onclick="gp()">Guardar perfil</button><button class="btn teal" onclick="go('profe-${S.id}')">👀 Así te ve un estudiante</button></div><p style="font-size:.9rem">Código de clase: <b>${S.code}</b> <button class="btn" style="padding:.3rem .7rem" onclick="S.code=cod();persist();tab('p')">Regenerar</button></p><button class="btn" onclick="logout()">Cerrar sesión</button></div><div class="card panel"><h2>Mi clase</h2><div class="row"><span class="pill">🧒 ${c.length} alumnos</span><span class="pill">📚 ${o.length} retos publicados</span><span class="pill">🎯 ${ok+ko?Math.round(ok/(ok+ko)*100):0}% de aciertos</span><span class="pill">🔥 racha media ${c.length?(c.reduce((a,s)=>a+streak(s),0)/c.length).toFixed(1):0}</span></div><h2 style="font-size:1.2rem;margin-top:1.2rem">Primer paso roto de mi clase</h2>${rk.length?rk.map(([k,v])=>`<div class="chip c-orange"><i></i>${STP[k]||k} · ${v} ${v==1?'error':'errores'}</div>`).join('')+'<p style="font-size:.9rem;color:var(--mut)">Sugerencia: crea un reto de refuerzo para el primer paso de la lista.</p>':'<p style="color:var(--mut)">Todavía no hay errores registrados. ¡Buen comienzo!</p>'}<h2 style="font-size:1.2rem;margin-top:1.2rem">Insignias</h2><div class="row">${BD([['🧩','Primer reto',o.length>=1],['📚','10 retos',o.length>=10],['🔥','Clase con racha',c.some(s=>streak(s)>=3)]])}</div></div></div>`};
function gp(){S.bio=$('#pb').value;S.school=$('#ps').value;S.grades=$('#pg').value;S.spec=$('#pe').value;persist();toast('Perfil guardado');nav('docente')}
function nav(v){const r=(k,l)=>`<button class="${v==k||(v=='reto'&&k=='ruta')?'on':''}" onclick="go('${k}')">${svg(k)}${l}</button>`;
$('#nav').innerHTML=r('inicio','Inicio')+r('ruta','Ruta')+(S?S.role=='t'?r('docente','Docente'):`<button class="${v=='perfil'?'on':''}" onclick="go('perfil')"><span style="font-size:1.1rem;line-height:18px">${S.av}</span>Perfil</button><span class="pill" style="background:var(--yel)">🔥${streak(S)}</span>`:`<button class="dx" onclick="diag()">${svg('diag')}<span>Diagnóstico</span></button><button class="dx" style="background:var(--amber)" onclick="go('entrar')">Entrar</button>`)+`<button class="th" onclick="theme()" aria-label="Cambiar entre modo claro y oscuro">${document.documentElement.dataset.theme=='dark'?'☀️':'🌙'}</button>`}
function route(){const[h,id]=(location.hash.slice(1)||'inicio').split('-');let v=['inicio','ruta','docente','reto','entrar','perfil','profe'].includes(h)?h:'inicio';if(v=='perfil'&&S&&S.role=='t')v='docente';if(v=='entrar'&&S)v=S.role=='t'?'docente':'perfil';EX=vis();nav(v);closeM();rr(({inicio:home,ruta,docente,reto:()=>reto(+id),entrar,perfil,profe:()=>profe(id)})[v]());scrollTo({top:0});if($('#tp'))prev()}
try{const s=localStorage.getItem('mates-theme');if(s)document.documentElement.dataset.theme=s}catch(e){}
function theme(){const d=document.documentElement,n=d.dataset.theme=='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('mates-theme',n)}catch(e){}nav((location.hash.slice(1)||'inicio').split('-')[0])}
route();
</script></body></html>
